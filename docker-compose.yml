services:
  db:
    image: postgres:16-alpine
    container_name: rifa_lael_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lael}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lael_secret_pass_2027}
      POSTGRES_DB: ${POSTGRES_DB:-chaderifa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lael} -d ${POSTGRES_DB:-chaderifa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rifa_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rifa_lael_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lael}:${POSTGRES_PASSWORD:-lael_secret_pass_2027}@db:5432/${POSTGRES_DB:-chaderifa}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      ENVIRONMENT: production
      SEED_DEMO: "false"
      DEFAULT_RESERVATION_HOURS: 72
      EXPIRATION_WORKER_INTERVAL: 60
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rifa_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rifa_lael_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      # URL interna do backend na rede Docker — usada pelos rewrites do Next.js
      # para fazer proxy de /api sem expor o backend diretamente.
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - rifa_network

  # Cloudflare Tunnel (OPCIONAL) — publicação pública sem abrir portas.
  # Ative com: docker compose --profile tunnel up -d
  # Configure CLOUDFLARE_TUNNEL_TOKEN no .env (nunca commitar).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rifa_lael_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
    profiles:
      - tunnel
    networks:
      - rifa_network

  # Proxy reverso com HTTPS automático (Caddy) — obrigatório em produção (§7)
  proxy:
    image: caddy:2-alpine
    container_name: rifa_lael_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - rifa_network

  # Backup agendado do PostgreSQL (pg_dump diário, mantém 14 cópias) — §7
  backup:
    image: postgres:16-alpine
    container_name: rifa_lael_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-lael_secret_pass_2027}
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U ${POSTGRES_USER:-lael} -d ${POSTGRES_DB:-chaderifa} -F c
        -f /backups/chaderifa_$$(date +%Y%m%d_%H%M%S).dump 2>/backups/last_error.log;
        ls -1t /backups/chaderifa_*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f;
        sleep 86400;
      done'
    volumes:
      - backups_data:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rifa_network

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  backups_data:
    driver: local

networks:
  rifa_network:
    driver: bridge
