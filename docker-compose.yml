services:
  db:
    image: postgres:16-alpine
    container_name: rifa_lael_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lael}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lael_secret_pass_2027}
      POSTGRES_DB: ${POSTGRES_DB:-chaderifa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lael} -d ${POSTGRES_DB:-chaderifa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rifa_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rifa_lael_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lael}:${POSTGRES_PASSWORD:-lael_secret_pass_2027}@db:5432/${POSTGRES_DB:-chaderifa}
      SECRET_KEY: ${SECRET_KEY:-super-secret-production-key-chaderifa-lael-2027}
      DEFAULT_RESERVATION_HOURS: 72
      TOTAL_NUMBERS: 100
      EXPIRATION_WORKER_INTERVAL: 60
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rifa_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rifa_lael_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - rifa_network

volumes:
  postgres_data:
    driver: local

networks:
  rifa_network:
    driver: bridge
